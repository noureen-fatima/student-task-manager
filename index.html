<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Task Manager</title>
</head>
<body>
  <main>
    <h1>Student Task Manager</h1>
    <form id="task-form">
      <p>
        <label for="task-title">Task title</label><br>
        <input id="task-title" name="title" type="text" size="40" required>
      </p>
      <p>
        <label for="task-description">Description</label><br>
        <textarea id="task-description" name="description" rows="4" cols="40"></textarea>
      </p>
      <button type="submit">Add task</button>
    </form>
  </main>
</body>
</html>
